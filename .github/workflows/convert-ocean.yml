name: Convert ocean simulation for web playback

on:
  push:
    paths:
      - ".github/workflows/convert-ocean.yml"

permissions:
  contents: write

jobs:
  convert:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Convert MKV to broadly compatible MP4
        run: |
          ffmpeg -y -i "assets/blender/seaaa.mkv" -map 0:v:0 -map 0:a? -c:v libx264 -preset medium -crf 21 -pix_fmt yuv420p -movflags +faststart -c:a aac -b:a 160k "assets/blender/ocean-simulation.mp4"
      - name: Commit converted video
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "assets/blender/ocean-simulation.mp4"
          git commit -m "Add web-compatible MP4 ocean simulation"
          git pull --rebase origin main
          git push

